<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>mBot Mobile — Simple Control</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080d18;--panel:#111a2a;--panel2:#18253a;
  --border:#293a53;--text:#f1f6ff;--muted:#96a8c1;
  --blue:#62b0ff;--green:#3ce0a0;--red:#ff657b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px;background:linear-gradient(135deg,#17345a,#080d18);border-bottom:1px solid var(--border)}
h1{font-size:22px;margin:5px 0}
main{max-width:600px;margin:auto;padding:12px;display:grid;gap:12px}
.card{padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}
h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;flex:1;min-height:45px}
button.primary{background:var(--blue);color:#071321;border-color:var(--blue)}
button.danger{background:#391a27;border-color:#743044;color:#ff9dad}
.status{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#68768a}
.dot.ok{background:var(--green);box-shadow:0 0 10px #3ce0a066}
.dot.err{background:var(--red)}
#joystick{position:relative;width:260px;height:260px;margin:10px auto;border:2px solid #354b68;border-radius:50%;background:#111a2a;touch-action:none;user-select:none}
#stick{position:absolute;width:60px;height:60px;left:100px;top:100px;border-radius:50%;background:var(--blue);pointer-events:none}
#log{background:#050912;border:1px solid var(--border);border-radius:8px;padding:8px;height:90px;overflow:auto;font:11px monospace;color:#c0d0e6}
</style>
</head>
<body>
<header>
  <h1>mBot Simple Control</h1>
</header>
<main>
  <section class="card">
    <h2>Connexion Bluetooth</h2>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Non connecté</span></div>
    <div class="row">
      <button id="connect" class="primary">Connecter</button>
      <button id="disconnect" disabled>Déconnecter</button>
    </div>
  </section>

  <section class="card" style="text-align:center">
    <h2>Joystick Tactile</h2>
    <div id="joystick"><div id="stick"></div></div>
    <div id="readout" style="color:var(--muted);font-size:12px;margin-bottom:10px">Relâché (Stop)</div>
    <button id="stop" class="danger">■ ARRÊT D'URGENCE</button>
  </section>

  <section class="card">
    <h2>Actions rapides</h2>
    <div class="row">
      <button id="btnBuzzer">Buzzer</button>
      <button id="btnLed">Matrice LED</button>
    </div>
  </section>

  <section class="card">
    <h2>Journal</h2>
    <div id="log">Prêt.</div>
  </section>
</main>

<script>
"use strict";
let device = null, tx = null, connected = false;
let lastSentCmd = "";

const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += "\n" + m; $("log").scrollTop = $("log").scrollHeight; };

async function sendCmd(cmd) {
  if (!connected || !tx) return;
  if (cmd === lastSentCmd && cmd !== "0") return; // Évite de spammer si la commande ne change pas
  lastSentCmd = cmd;
  try {
    const encoder = new TextEncoder();
    await tx.writeValueWithoutResponse(encoder.encode(cmd));
    log("Envoyé : " + cmd);
  } catch (e) {
    log("Erreur d'envoi : " + e.message);
  }
}

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb", "6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
    });
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    for (let s of services) {
      const chars = await s.getCharacteristics();
      for (let c of chars) {
        if (c.properties.write || c.properties.writeWithoutResponse) {
          tx = c;
          break;
        }
      }
      if (tx) break;
    }
    if (!tx) throw new Error("Aucune caractéristique d'écriture trouvée.");
    
    connected = true;
    $("connect").disabled = true;
    $("disconnect").disabled = false;
    $("dot").className = "dot ok";
    $("status").textContent = "Connecté à " + (device.name || "mBot");
    log("Connecté avec succès !");
  } catch (e) {
    log("Erreur connexion : " + e.message);
  }
}

$("connect").onclick = connect;
$("disconnect").onclick = () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  connected = false;
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  $("dot").className = "dot";
  $("status").textContent = "Non connecté";
  log("Déconnecté.");
};

// Gestion Joystick simplifiée (Envoie '1':Avancer, '2':Reculer, '3':Gauche, '4':Droite, '0':Stop)
const joy = $("joystick"), stick = $("stick");
let active = false;

function handleMove(e) {
  if (!active) return;
  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const maxR = 90;

  if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
  stick.style.left = (100 + dx) + "px";
  stick.style.top = (100 + dy) + "px";

  if (Math.abs(dy) > Math.abs(dx)) {
    if (dy < -20) { sendCmd("1"); $("readout").textContent = "Avancer ('1')"; }
    else if (dy > 20) { sendCmd("2"); $("readout").textContent = "Reculer ('2')"; }
  } else {
    if (dx < -20) { sendCmd("3"); $("readout").textContent = "Gauche ('3')"; }
    else if (dx > 20) { sendCmd("4"); $("readout").textContent = "Droite ('4')"; }
  }
}

joy.onpointerdown = e => { active = true; joy.setPointerCapture(e.pointerId); };
joy.onpointermove = handleMove;
function release() {
  if (!active) return;
  active = false;
  stick.style.left = "100px";
  stick.style.top = "100px";
  sendCmd("0");
  $("readout").textContent = "Arrêt ('0')";
}
joy.onpointerup = release;
joy.onpointercancel = release;

$("stop").onclick = () => { sendCmd("0"); $("readout").textContent = "Arrêt d'urgence ('0')"; };
$("btnBuzzer").onclick = () => sendCmd("5");
$("btnLed").onclick = () => sendCmd("6");
</script>
</body>
</html>
