<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>mBot Mobile — Simple Control</title>
<style>
:root {
  color-scheme: dark;
  --bg:#080d18; --panel:#111a2a; --panel2:#18253a;
  --border:#293a53; --text:#f1f6ff; --muted:#96a8c1;
  --blue:#62b0ff; --green:#3ce0a0; --red:#ff657b;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header {
  padding:20px; background:linear-gradient(135deg,#17345a,#080d18);
  border-bottom:1px solid var(--border);
}
h1 { font-size:22px; margin:5px 0; }
main { max-width:600px; margin:auto; padding:12px; display:grid; gap:12px; }
.card { padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--panel); }
h2 { font-size:15px; margin:0 0 10px; }
.row { display:flex; gap:8px; }
button {
  font:inherit; font-weight:700; color:var(--text); background:var(--panel2);
  border:1px solid var(--border); border-radius:10px; padding:12px;
  flex:1; min-height:45px;
}
button.primary { background:var(--blue); color:#071321; border-color:var(--blue); }
button.danger { background:#391a27; border-color:#743044; color:#ff9dad; }
button:disabled { opacity:.45; }
.status { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; }
.dot { width:10px; height:10px; border-radius:50%; background:#68768a; }
.dot.ok { background:var(--green); box-shadow:0 0 10px #3ce0a066; }
.dot.err { background:var(--red); }
#joystick {
  position:relative; width:260px; height:260px; max-width:100%;
  margin:10px auto; border:2px solid #354b68; border-radius:50%;
  background:#111a2a; touch-action:none; user-select:none;
}
#stick {
  position:absolute; width:60px; height:60px; left:98px; top:98px;
  border-radius:50%; background:var(--blue); pointer-events:none;
}
#log {
  background:#050912; border:1px solid var(--border); border-radius:8px;
  padding:8px; height:110px; overflow:auto; overflow-wrap:anywhere;
  font:11px monospace; color:#c0d0e6; white-space:pre-wrap;
}
.note { color:var(--muted); font-size:12px; line-height:1.5; }
</style>
</head>
<body>
<header><h1>mBot Simple Control</h1></header>

<main>
  <section class="card">
    <h2>Connexion Bluetooth</h2>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="status">Non connecté</span>
    </div>
    <div class="row">
      <button id="connect" class="primary">Connecter</button>
      <button id="disconnect" disabled>Déconnecter</button>
    </div>
    <p class="note">Utilise un navigateur compatible Web Bluetooth, par exemple Chrome ou Edge sur ordinateur, et une page HTTPS.</p>
  </section>

  <section class="card" style="text-align:center">
    <h2>Joystick tactile</h2>
    <div id="joystick"><div id="stick"></div></div>
    <div id="readout" class="note">Relâché — Stop</div>
    <button id="stop" class="danger">■ ARRÊT D'URGENCE</button>
  </section>

  <section class="card">
    <h2>Actions rapides</h2>
    <div class="row">
      <button id="btnBuzzer">Buzzer</button>
      <button id="btnLed">Matrice LED</button>
    </div>
  </section>

  <section class="card">
    <h2>Journal</h2>
    <div id="log">Prêt.</div>
    <button id="clearLog" style="margin-top:8px">Effacer le journal</button>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

let device = null;
let tx = null;
let connected = false;
let active = false;
let activeCmd = "0";
let lastSentCmd = "";
let writeBusy = false;
let lastWriteTime = 0;

const SERVICE_UUIDS = [
  "0000ffe0-0000-1000-8000-00805f9b34fb",
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
];

const TX_UUIDS = [
  "0000ffe1-0000-1000-8000-00805f9b34fb",
  "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
];

function log(message) {
  const box = $("log");
  box.textContent += "\n" + new Date().toLocaleTimeString() + " " + message;
  box.scrollTop = box.scrollHeight;
}

function setStatus(message, state = "") {
  $("status").textContent = message;
  $("dot").className = "dot" + (state ? " " + state : "");
}

function resetJoystick() {
  active = false;
  activeCmd = "0";
  $("stick").style.left = "98px";
  $("stick").style.top = "98px";
  $("readout").textContent = "Relâché — Stop";
}

async function sendCmd(cmd, force = false) {
  if (!connected || !tx) return;
  if (!force && cmd === lastSentCmd) return;
  if (writeBusy) return;

  writeBusy = true;
  try {
    const bytes = new TextEncoder().encode(cmd);

    if (tx.properties.writeWithoutResponse &&
        typeof tx.writeValueWithoutResponse === "function") {
      await tx.writeValueWithoutResponse(bytes);
    } else if (tx.properties.write) {
      await tx.writeValue(bytes);
    } else {
      throw new Error("La caractéristique n'autorise pas l'écriture.");
    }

    lastSentCmd = cmd;
    lastWriteTime = Date.now();

    if (cmd === "0" || cmd === "1" || cmd === "2" ||
        cmd === "3" || cmd === "4") {
      log("Commande envoyée : " + cmd);
    } else {
      log("Action envoyée : " + cmd);
    }
  } catch (error) {
    log("Erreur d'envoi : " + error.message);
    if (error.name === "NetworkError" ||
        error.name === "InvalidStateError") {
      setStatus("Connexion perdue", "err");
    }
  } finally {
    writeBusy = false;
  }
}

async function findWritableCharacteristic(server) {
  // Recherche d'abord les services UART connus.
  for (const uuid of SERVICE_UUIDS) {
    try {
      const service = await server.getPrimaryService(uuid);
      const chars = await service.getCharacteristics();

      for (const charUuid of TX_UUIDS) {
        const match = chars.find(c =>
          c.uuid.toLowerCase() === charUuid &&
          (c.properties.write || c.properties.writeWithoutResponse)
        );
        if (match) return match;
      }

      const writable = chars.find(c =>
        c.properties.write || c.properties.writeWithoutResponse
      );
      if (writable) return writable;
    } catch (_) {
      // Le périphérique n'expose pas ce service : essayer le suivant.
    }
  }

  // Dernier recours : inspecter les services autorisés.
  const services = await server.getPrimaryServices();

  for (const service of services) {
    const chars = await service.getCharacteristics();
    const writable = chars.find(c =>
      c.properties.write || c.properties.writeWithoutResponse
    );
    if (writable) return writable;
  }

  return null;
}

async function connectRobot() {
  if (!("bluetooth" in navigator)) {
    log("Web Bluetooth indisponible. Essaie Chrome ou Edge sur une page HTTPS.");
    setStatus("Bluetooth non pris en charge", "err");
    return;
  }

  try {
    $("connect").disabled = true;
    log("Recherche du robot BLE…");

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: SERVICE_UUIDS
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);

    log("Périphérique sélectionné : " + (device.name || "sans nom"));
    const server = await device.gatt.connect();

    tx = await findWritableCharacteristic(server);

    if (!tx) {
      throw new Error(
        "Aucune caractéristique d'écriture compatible trouvée."
      );
    }

    connected = true;
    lastSentCmd = "";
    $("disconnect").disabled = false;
    setStatus("Connecté : " + (device.name || "mBot"), "ok");
    log("Caractéristique d'écriture : " + tx.uuid);
    log("Connexion établie.");
    await sendCmd("0", true);
  } catch (error) {
    connected = false;
    tx = null;
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    setStatus("Connexion échouée", "err");
    log("Erreur Bluetooth : " + error.message);
  }
}

function onDisconnected() {
  connected = false;
  tx = null;
  writeBusy = false;
  lastSentCmd = "";
  resetJoystick();
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  setStatus("Non connecté", "");
  log("Périphérique déconnecté.");
}

async function disconnectRobot() {
  // Demande l'arrêt avant la déconnexion, si le lien fonctionne.
  await sendCmd("0", true);

  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  } else {
    onDisconnected();
  }
}

$("connect").addEventListener("click", connectRobot);
$("disconnect").addEventListener("click", disconnectRobot);

$("clearLog").addEventListener("click", () => {
  $("log").textContent = "Journal effacé.";
});

const joy = $("joystick");
const stick = $("stick");

function setJoystickCommand(cmd, label) {
  if (activeCmd !== cmd) {
    activeCmd = cmd;
    $("readout").textContent = label;
    sendCmd(cmd);
  }
}

function handleMove(event) {
  if (!active) return;

  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = event.clientX - cx;
  let dy = event.clientY - cy;
  const distance = Math.hypot(dx, dy);
  const maxR = 90;

  if (distance > maxR) {
    dx = dx / distance * maxR;
    dy = dy / distance * maxR;
  }

  stick.style.left = (98 + dx) + "px";
  stick.style.top = (98 + dy) + "px";

  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
    setJoystickCommand("0", "Centre — Stop");
  } else if (Math.abs(dy) >= Math.abs(dx)) {
    if (dy < -20) setJoystickCommand("1", "Avancer");
    else setJoystickCommand("2", "Reculer");
  } else {
    if (dx < -20) setJoystickCommand("3", "Gauche");
    else setJoystickCommand("4", "Droite");
  }
}

function releaseJoystick() {
  if (!active) return;
  active = false;
  activeCmd = "0";
  stick.style.left = "98px";
  stick.style.top = "98px";
  $("readout").textContent = "Arrêt";
  sendCmd("0", true);
}

joy.addEventListener("pointerdown", event => {
  if (!connected) {
    log("Connecte le robot avant d'utiliser le joystick.");
    return;
  }
  active = true;
  joy.setPointerCapture(event.pointerId);
  handleMove(event);
});

joy.addEventListener("pointermove", handleMove);
joy.addEventListener("pointerup", releaseJoystick);
joy.addEventListener("pointercancel", releaseJoystick);
joy.addEventListener("lostpointercapture", releaseJoystick);

$("stop").addEventListener("click", () => {
  resetJoystick();
  sendCmd("0", true);
  $("readout").textContent = "Arrêt d'urgence";
});

// Les commandes de mouvement sont répétées pendant le maintien
// du joystick, afin que le robot puisse appliquer un timeout sûr.
setInterval(() => {
  if (connected && active && activeCmd >= "1" && activeCmd <= "4") {
    sendCmd(activeCmd, true);
  }
}, 250);

$("btnBuzzer").addEventListener("click", () => sendCmd("5", true));
$("btnLed").addEventListener("click", () => sendCmd("6", true));

window.addEventListener("blur", releaseJoystick);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseJoystick();
});
</script>
</body>
</html>
